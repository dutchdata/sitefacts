[package]
name = "sitefacts"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
description = "One facts file → every machine-readable file a small website needs: llms.txt, llms-full.txt, schema.org JSON-LD (inline and standalone), Open Graph and Twitter meta, robots.txt with AI crawlers named, sitemap.xml, ai.txt, humans.txt, security.txt, web manifest, IndexNow key. `sync` lists your public GitHub repositories and crates. Deterministic; --check tells you when outputs are stale."
license = "MIT OR Apache-2.0"
repository = "https://github.com/dutchdata/sitefacts"
keywords = ["llms-txt", "seo", "schema-org", "sitemap", "static-site"]
categories = ["command-line-utilities", "web-programming"]
readme = "README.md"

[[bin]]
name = "sitefacts"
path = "src/bin/sitefacts.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
ureq = { version = "2.10", features = ["json"], optional = true }

[features]
default = ["sync"]
# `sitefacts sync`: fetch public repositories (GitHub) and packages (crates.io) into code.json. The only network code.
sync = ["dep:ureq"]

[dev-dependencies]
tempfile = "3"
